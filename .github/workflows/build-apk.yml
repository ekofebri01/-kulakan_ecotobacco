name: Build & Sign Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 50

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Auto-Update Changelog & Release Notes
        id: changelog
        run: python3 .github/scripts/auto_changelog.py

      - name: Verify Android SDK & Build-Tools 34.0.0
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ -x "$SDK_ROOT/build-tools/34.0.0/apksigner" ] && [ -x "$SDK_ROOT/build-tools/34.0.0/zipalign" ] && [ -d "$SDK_ROOT/platforms/android-34" ]; then
            echo "Android SDK Build-Tools 34.0.0 & Platform android-34 sudah tersedia, skip setup SDK."
            exit 0
          fi
          SDKMANAGER=""
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$SDK_ROOT/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/tools/bin/sdkmanager"
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "build-tools;34.0.0" "platforms;android-34"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"
          cache-cleanup: on-success

      - name: Ensure debug.keystore exists for Gradle config
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Restore google-services.json from Secret (if configured)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

      - name: Build Release APK
        run: >
          gradle :app:assembleRelease
          --no-daemon
          --build-cache
          --parallel
          -Dorg.gradle.jvmargs="-Xmx4096M -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dfile.encoding=UTF-8"

      - name: Resolve App Version & Output Filename
        id: version_info
        run: |
          VERSION_NAME=$(grep -m 1 'versionName\s*=\s*' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -m 1 'versionCode\s*=\s*' app/build.gradle.kts | sed -E 's/.*=\s*([0-9]+).*/\1/')
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="latest"
          fi
          APK_NAME="EcoTobacco-v${VERSION_NAME}.apk"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          else
            RELEASE_TAG="v${VERSION_NAME}"
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved Version: v$VERSION_NAME (Build $VERSION_CODE) -> $APK_NAME (Tag: $RELEASE_TAG)"

      - name: Sign Release APK with Upload Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FINAL_APK: ${{ steps.version_info.outputs.apk_name }}
        run: |
          BT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/34.0.0"
          RAW_APK="app/build/outputs/apk/release/app-release.apk"

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
            PASS_KEY="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            "$BT/zipalign" -f -p 4 "$RAW_APK" aligned-release.apk
            "$BT/apksigner" sign \
              --ks upload-keystore.jks \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$PASS_KEY" \
              --out "$FINAL_APK" \
              aligned-release.apk
            rm -f upload-keystore.jks aligned-release.apk "${FINAL_APK}.idsig"
            "$BT/apksigner" verify --print-certs "$FINAL_APK"
          else
            echo "::warning::Secret keystore belum diisi, memakai fallback build APK Gradle."
            cp "$RAW_APK" "$FINAL_APK"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.version_info.outputs.apk_name }}
          path: ${{ steps.version_info.outputs.apk_name }}
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version_info.outputs.release_tag }}
          name: "Eco Tobacco v${{ steps.version_info.outputs.version_name }} (Build ${{ steps.version_info.outputs.version_code }})"
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          files: ${{ steps.version_info.outputs.apk_name }}
          fail_on_unmatched_files: true
          make_latest: true

      - name: Commit Auto-Updated CHANGELOG.md back to branch
        if: steps.changelog.outputs.changelog_updated == 'true' && startsWith(github.ref, 'refs/heads/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(changelog): update CHANGELOG.md for v${{ steps.version_info.outputs.version_name }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }} || true
          fi
